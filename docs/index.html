@font-face {
  font-family: "Marcellus";
  src: url("fonts/Marcellus-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
html {
  min-height: 100%;
  background: linear-gradient(#fff3a6, #ffd761);
}
body {
  margin: 0;
  padding: 0 5%;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
ul {
  list-style: none;
  padding: 0;
  margin: 20vh 0 0;
  text-align: center;
  font: bold 20pt "Marcellus", Helvetica, Arial, sans-serif;
  color: #1f6391;
}
li {
  margin: 0 0 1em;
}
a {
  color: inherit;
  text-decoration: none;
}
a:hover {
  font-style: italic;
  text-decoration: underline dashed;
}
.social {
  margin-top: auto;
  padding: 2em 16px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: center;
  gap: 6px;
}
.social a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  color: #1f6391;
  border: 1px solid rgba(31, 99, 145, .3);
  background: rgba(255, 255, 255, .35);
}
.social a:hover {
  color: #0b3a5b;
  border-color: #1f6391;
  font-style: normal;
  text-decoration: none;
}
.social a:focus-visible {
  outline: 2px solid #1f6391;
  outline-offset: 2px;
}
.social svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
</style>
